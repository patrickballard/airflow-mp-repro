name: mp-repro
on:
  workflow_dispatch:
    inputs:
      suite:
        description: "diagnosis: the question's cases, controls and first fixes; fixes: the fixes, with a stray-process check"
        type: choice
        options: [diagnosis, fixes]
        default: diagnosis

permissions:
  contents: read

jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 30      # a hanging case can't burn more than this
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: airflow, POSTGRES_PASSWORD: airflow, POSTGRES_DB: airflow}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U airflow" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      AIRFLOW_HOME: ${{ github.workspace }}/home
      AIRFLOW__CORE__DAGS_FOLDER: ${{ github.workspace }}/dags
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@localhost:5432/airflow
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
      AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "5"
      AIRFLOW__DAG_PROCESSOR__MIN_FILE_PROCESS_INTERVAL: "5"
      PYTHONPATH: ${{ github.workspace }}/include     # makes include/mp_worker.py importable (fix b)
      PG_URL: postgresql://airflow:airflow@localhost:5432/airflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: astral-sh/setup-uv@v6
      - name: Install Airflow 3.3.2 (official constraints) and py-spy
        run: |
          uv venv .venv --python python3.12
          uv pip install --python .venv/bin/python "apache-airflow[postgres]==3.3.2" \
            -c https://raw.githubusercontent.com/apache/airflow/constraints-3.3.2/constraints-3.12.txt
          uv pip install --python .venv/bin/python py-spy
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "PYSPY=$PWD/.venv/bin/py-spy" >> "$GITHUB_ENV"
      - name: Start Airflow (airflow standalone - scheduler + LocalExecutor, dag-processor, api-server, triggerer)
        timeout-minutes: 6
        run: |
          mkdir -p diag
          { airflow version; python -c "import multiprocessing as m, sys; print(sys.version); print('default start method:', m.get_start_method())"
            airflow config get-value workers socket_cleanup_timeout; airflow config get-value core task_success_overtime; } | tee diag/versions.txt
          nohup airflow standalone > standalone.log 2>&1 &
          for i in $(seq 1 120); do curl -sf localhost:8080/api/v2/monitor/health > /dev/null && break; sleep 2; done
          curl -s localhost:8080/api/v2/monitor/health; echo
          for i in $(seq 1 60); do n=$(airflow dags list -o plain 2>/dev/null | grep -cE '^(mp_|ctl_|fix)'); [ "$n" -ge 14 ] && break; sleep 3; done
          airflow dags list -o plain | grep -E '^(mp_|ctl_|fix)'
      - name: "Case: fork, as in the question"
        timeout-minutes: 5
        continue-on-error: true
        if: inputs.suite == 'diagnosis'
        run: CASE=1_fork ci/run_case.sh mp_fork
      - name: "Case: spawn, as in the question"
        timeout-minutes: 5
        continue-on-error: true
        if: inputs.suite == 'diagnosis'
        run: CASE=2_spawn ci/run_case.sh mp_spawn
      - name: "Control: fork, Pool only, no Manager"
        timeout-minutes: 5
        continue-on-error: true
        if: inputs.suite == 'diagnosis'
        run: CASE=3_ctl_fork_no_manager ci/run_case.sh ctl_fork_no_manager
      - name: "Control: fork, Manager shut down before returning"
        timeout-minutes: 5
        continue-on-error: true
        if: inputs.suite == 'diagnosis'
        run: CASE=4_ctl_fork_manager_shutdown ci/run_case.sh ctl_fork_manager_shutdown
      - name: "Causality: fork, SIGTERM reset to default in Pool workers"
        timeout-minutes: 5
        continue-on-error: true
        if: inputs.suite == 'diagnosis'
        run: CASE=5_ctl_fork_sigterm_default ci/run_case.sh ctl_fork_sigterm_default
      - name: "Causality: fork, pool.close() + join() before the with-block exits"
        timeout-minutes: 5
        continue-on-error: true
        if: inputs.suite == 'diagnosis'
        run: CASE=6_ctl_fork_close_join ci/run_case.sh ctl_fork_close_join
      - name: "Fix (a): subprocess.run of the script"
        timeout-minutes: 5
        continue-on-error: true
        if: inputs.suite == 'diagnosis'
        run: CASE=7_fix_subprocess ci/run_case.sh fix_subprocess
      - name: "Fix (b): spawn, importable worker, no Manager"
        timeout-minutes: 5
        continue-on-error: true
        if: inputs.suite == 'diagnosis'
        run: CASE=8_fix_spawn_importable ci/run_case.sh fix_spawn_importable
      - name: "Fix (b2): spawn, importable worker, no Manager, no __main__ re-run"
        timeout-minutes: 5
        continue-on-error: true
        if: inputs.suite == 'diagnosis'
        run: CASE=9_fix_spawn_hide_main ci/run_case.sh fix_spawn_hide_main
      - name: "Fix 1: initializer resets SIGTERM (Manager left running)"
        timeout-minutes: 5
        continue-on-error: true
        if: inputs.suite == 'fixes'
        run: STRAY_CHECK=1 CASE=F1_initializer ci/run_case.sh ctl_fork_sigterm_default
      - name: "Fix 1: initializer resets SIGTERM, with-block Manager"
        timeout-minutes: 5
        continue-on-error: true
        if: inputs.suite == 'fixes'
        run: STRAY_CHECK=1 CASE=F2_initializer_manager_ctx ci/run_case.sh fix1_initializer_manager_ctx
      - name: "Fix 2: close() + join(), no with-block (Manager left running)"
        timeout-minutes: 5
        continue-on-error: true
        if: inputs.suite == 'fixes'
        run: STRAY_CHECK=1 CASE=F3_close_join ci/run_case.sh fix2_close_join
      - name: "Fix 2: close() + join(), with-block Manager"
        timeout-minutes: 5
        continue-on-error: true
        if: inputs.suite == 'fixes'
        run: STRAY_CHECK=1 CASE=F4_close_join_manager_ctx ci/run_case.sh fix2_close_join_manager_ctx
      - name: "Fix 3: spawn parser via subprocess.run (parse_xml.py)"
        timeout-minutes: 5
        continue-on-error: true
        if: inputs.suite == 'fixes'
        run: STRAY_CHECK=1 CASE=F5_spawn_subprocess ci/run_case.sh fix3_spawn_subprocess
      - name: "Fix (a): fork script via subprocess.run"
        timeout-minutes: 5
        continue-on-error: true
        if: inputs.suite == 'fixes'
        run: STRAY_CHECK=1 CASE=F6_fork_subprocess ci/run_case.sh fix_subprocess
      - name: "Positive control: a forked child left sleeping after success (the stray check must see it)"
        timeout-minutes: 5
        continue-on-error: true
        if: inputs.suite == 'fixes'
        run: STRAY_CHECK=1 CASE=F7_stray_positive_control ci/run_case.sh ctl_stray_positive
      - name: Summary
        if: always()
        run: |
          for f in diag/*/timeline.txt; do echo "== ${f%/timeline.txt}"; tail -1 "$f"; done | tee diag/summary.txt
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics
          path: |
            diag/
            home/logs/
            standalone.log
